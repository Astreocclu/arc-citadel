# Cautious AI personality
# Defensive posture, preserves forces, withdraws early from losing battles

[behavior]
aggression = 0.2      # Defensive focus
caution = 0.8         # Risk-averse
initiative = 0.3      # Mostly reactive
cunning = 0.4         # Some tactical finesse

[weights]
attack_value = 0.7        # Lower attack priority
defense_value = 1.4       # High defense priority
flanking_value = 1.3      # Exploits safe flanking opportunities
reserve_value = 1.2       # Preserves reserves
retreat_threshold = 0.5   # Retreats when outnumbered 2:1
casualty_threshold = 0.3  # Considers withdrawal at 30% casualties

[preferences]
preferred_range = "ranged"        # Prefers ranged engagement
reserve_usage = "conservative"    # Holds reserves until desperate
re_evaluation_interval = 8        # Regular reassessment

[difficulty]
ignores_fog_of_war = false
reaction_delay = 3           # Slower, more deliberate
mistake_chance = 0.05        # Careful reduces mistakes
