# Hard difficulty AI personality
# Expert tactician - makes excellent decisions within fair constraints
# NO CHEATS: respects fog of war, uses only information available to player

[behavior]
aggression = 0.65     # Calculated aggression, knows when to push
caution = 0.45        # Takes smart risks
initiative = 0.85     # Very proactive, seizes opportunities
cunning = 0.8         # Heavy use of feints, misdirection

[weights]
attack_value = 1.3        # Prioritizes high-value targets
defense_value = 1.2       # Strong positional awareness
flanking_value = 1.6      # Exploits flanks aggressively
reserve_value = 1.1       # Excellent timing on reserves
retreat_threshold = 0.25  # Knows when to retreat
casualty_threshold = 0.55 # Fights hard but preserves force

[preferences]
preferred_range = "medium"       # Adapts to situation
reserve_usage = "conservative"   # Uses reserves at critical moments
re_evaluation_interval = 3       # Rapid tactical adaptation

[difficulty]
ignores_fog_of_war = false   # FAIR: respects fog of war like player
reaction_delay = 1           # Quick but not instant (human-like)
mistake_chance = 0.03        # Rarely makes suboptimal decisions
