# Hard difficulty AI personality
# Near-perfect decisions, fast reactions, exploits every weakness

[behavior]
aggression = 0.6      # Calculated aggression
caution = 0.5         # Balanced risk assessment
initiative = 0.8      # Very proactive
cunning = 0.7         # Uses deception effectively

[weights]
attack_value = 1.3        # Optimized targeting
defense_value = 1.2       # Strong defense
flanking_value = 1.5      # Exploits flanks
reserve_value = 1.0       # Perfect timing on reserves
retreat_threshold = 0.25  # Knows when to retreat
casualty_threshold = 0.55 # Fights hard but not suicidal

[preferences]
preferred_range = "medium"       # Adapts to situation
reserve_usage = "conservative"   # Uses reserves optimally
re_evaluation_interval = 4       # Rapid adaptation

[difficulty]
ignores_fog_of_war = true    # Cheats: sees through fog
reaction_delay = 0           # Instant reactions
mistake_chance = 0.02        # Near-perfect decisions
