# Easy difficulty AI personality
# Makes frequent mistakes, slow reactions, predictable behavior

[behavior]
aggression = 0.4      # Somewhat passive
caution = 0.6         # Hesitant
initiative = 0.3      # Very reactive
cunning = 0.1         # Predictable

[weights]
attack_value = 0.8        # Suboptimal targeting
defense_value = 0.9       # Okay defense
flanking_value = 0.8      # Rarely flanks
reserve_value = 1.0       # Holds reserves too long
retreat_threshold = 0.4   # Retreats reasonably
casualty_threshold = 0.4  # Average withdrawal threshold

[preferences]
preferred_range = "medium"
reserve_usage = "conservative"
re_evaluation_interval = 15    # Slow to adapt

[difficulty]
ignores_fog_of_war = false
reaction_delay = 5           # Very slow reactions
mistake_chance = 0.3         # Frequent mistakes
