# Aggressive AI personality
# Attacks relentlessly, commits reserves early, fights to the last

[behavior]
aggression = 0.9      # Very attack-focused
caution = 0.2         # Takes risks
initiative = 0.8      # Proactive attacker
cunning = 0.2         # Direct approach

[weights]
attack_value = 1.5        # Prioritizes attacking
defense_value = 0.6       # Low defense priority
flanking_value = 1.0      # Takes flanks but prefers direct assault
reserve_value = 0.4       # Commits reserves quickly
retreat_threshold = 0.15  # Only retreats when severely outnumbered
casualty_threshold = 0.7  # Fights through heavy casualties

[preferences]
preferred_range = "close"      # Seeks melee engagement
reserve_usage = "early"        # Commits reserves early
re_evaluation_interval = 5     # Frequent reassessment

[difficulty]
ignores_fog_of_war = false
reaction_delay = 1           # Quick reactions
mistake_chance = 0.15        # Aggression leads to some mistakes
